services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cloud_drive
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-java
    ports:
      - "8080:8080"
    environment:
      APP_MODE: prod
      # Java/Spring Boot 后端（Dockerfile.backend-java；prod 必须提供 LLM 加密主密钥 ≥32B；JWT secret 可覆盖）
      CD_LLM_ENCRYPTION_KEY: ${CD_LLM_ENCRYPTION_KEY:-dev-only-llm-encryption-key-change-me-32b}
      CD_JWT_SECRET: ${CD_JWT_SECRET:-change-me-in-production}
      CD_MYSQL_DSN: jdbc:mysql://mysql:3306/cloud_drive?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      CD_MYSQL_USER: root
      CD_MYSQL_PASSWORD: root
      CD_REDIS_ADDR: redis:6379
      CD_MINIO_ENDPOINT: minio:9000
      CD_AGENT_BASE_URL: http://agent:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    # agent 无入站鉴权（信任后端注入的 X-User-Id），只允许宿主机本地访问，
    # 不得对公网暴露，否则可伪造任意用户身份。
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      REDIS_URL: redis://redis:6379/0
      BACKEND_URL: http://backend:8080/api/v1
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  minio_data:
  redis_data:
  qdrant_data: