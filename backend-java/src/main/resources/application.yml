server:
  port: ${CD_SERVER_PORT:8080}

spring:
  application:
    name: cloud-drive-backend
  datasource:
    url: ${CD_MYSQL_DSN:jdbc:mysql://localhost:3306/cloud_drive?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${CD_MYSQL_USER:root}
    password: ${CD_MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
        format_sql: false
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 52MB
      max-request-size: 53MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
    property-naming-strategy: SNAKE_CASE

cd:
  server-port: ${CD_SERVER_PORT:8080}
  mysql-dsn: ${CD_MYSQL_DSN:jdbc:mysql://localhost:3306/cloud_drive?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
  redis-addr: ${CD_REDIS_ADDR:localhost:6379}
  redis-password: ${CD_REDIS_PASSWORD:}
  jwt-secret: ${CD_JWT_SECRET:change-me-in-production}
  jwt-expire-hours: ${CD_JWT_EXPIRE_HOURS:72}
  minio-endpoint: ${CD_MINIO_ENDPOINT:localhost:9100}
  minio-access-key: ${CD_MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${CD_MINIO_SECRET_KEY:minioadmin}
  minio-bucket: ${CD_MINIO_BUCKET:cloud-drive}
  upload-direct-max-bytes: ${CD_UPLOAD_DIRECT_MAX_BYTES:52428800}
  upload-chunk-max-bytes: ${CD_UPLOAD_CHUNK_MAX_BYTES:10485760}
  upload-file-max-bytes: ${CD_UPLOAD_FILE_MAX_BYTES:10737418240}
  agent-base-url: ${CD_AGENT_BASE_URL:http://127.0.0.1:8000}
  agent-response-header-timeout-sec: ${CD_AGENT_RESPONSE_HEADER_TIMEOUT_SEC:60}
  agent-max-concurrent: ${CD_AGENT_MAX_CONCURRENT:20}
  llm-encryption-key: ${CD_LLM_ENCRYPTION_KEY:dev-only-llm-encryption-key-change-me-32b}

logging:
  level:
    com.clouddrive: info
